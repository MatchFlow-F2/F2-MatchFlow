<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Candidates - MatchFlow</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Candidate</title>
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div>
          <h1 class="sidebar-logo">MatchFlow</h1>

          <nav class="sidebar-nav">
            <a href="/src/pages/dashboard/index.html">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="/src/pages/jobs/index.html">
              <i class="fa-solid fa-briefcase"></i> Jobs
            </a>

            <a href="/src/pages/candidates/index.html" class="active">
              <i class="fa-solid fa-user-group"></i> Candidates
            </a>

            <a href="/src/pages/matches/index.html">
              <i class="fa-solid fa-handshake"></i> Matches
            </a>

            <a href="/src/pages/interviews/index.html">
              <i class="fa-solid fa-calendar-check"></i> Interviews
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1">
              <div class="avatar"></div>
              <div>
                <p class="user-name" id="profile-name">Company</p>
                <p class="user-role" id="profile-role">Company</p>
              </div>
            </div>
            <button id="logout-btn" title="Logout" class="px-2 py-1 text-red-600 hover:text-red-700 hover:bg-red-600 hover:bg-opacity-10 rounded transition">
              <i class="fa-solid fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <div>
          <h2 class="title-xl">Find Candidates</h2>
          <p class="text-muted">Search for talented candidates</p>
        </div>

        <!-- Search & Filters -->
        <div class="card mb-4">
          <div class="card-body">
            <div class="grid grid-cols-3 gap-3 mb-3">
              <div>
                <label class="text-sm font-medium mb-1 block">Role</label>
                <input 
                  type="text" 
                  id="filter-role" 
                  class="w-full px-3 py-2 bg-background-card rounded border border-background-hover text-sm"
                  placeholder="e.g., Developer, Designer"
                />
              </div>
              <div>
                <label class="text-sm font-medium mb-1 block">Location</label>
                <input 
                  type="text" 
                  id="filter-location" 
                  class="w-full px-3 py-2 bg-background-card rounded border border-background-hover text-sm"
                  placeholder="e.g., New York, Remote"
                />
              </div>
              <div class="flex items-end">
                <button id="btn-search" class="w-full px-3 py-2 bg-brand text-white rounded text-sm font-medium hover:bg-opacity-90">
                  Search
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Candidates Count -->
        <div class="mb-3">
          <p class="text-muted text-sm"><span id="candidates-count">Loading...</span></p>
        </div>

        <!-- Candidates List -->
        <div id="candidates-container" class="flex flex-col gap-3">
          <div class="text-center text-muted py-8">Loading candidates...</div>
        </div>
      </main>
    </div>
    <script src="/src/components/sidebar/sidebar.js"></script>
    <script type="module" src="./candidates.js"></script>

          return;
        }
        if (user.role !== "candidate") {
          window.location.replace("../dashboard/index.html");
        }
      })();
    </script> -->
  </body>
</html>
