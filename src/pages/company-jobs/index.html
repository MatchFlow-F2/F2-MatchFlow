<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Job Offers - MatchFlow</title>

    <link rel="stylesheet" href="/src/styles/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div>
          <h1 class="sidebar-logo">MatchFlow</h1>

          <nav class="sidebar-nav">
            <a href="/src/pages/dashboard/index.html">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="/src/pages/jobs/index.html" class="active">
              <i class="fa-solid fa-briefcase"></i> Jobs
            </a>

            <a href="/src/pages/candidates/index.html">
              <i class="fa-solid fa-user-group"></i> Candidates
            </a>

            <a href="/src/pages/matches/index.html">
              <i class="fa-solid fa-handshake"></i> Matches
            </a>

            <a href="/src/pages/interviews/index.html">
              <i class="fa-solid fa-calendar-check"></i> Interviews
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1">
              <div class="avatar"></div>
              <div>
                <p class="user-name" id="profile-name">Company</p>
                <p class="user-role" id="profile-role">Company</p>
              </div>
            </div>
            <button id="logout-btn" title="Logout" class="px-2 py-1 text-red-600 hover:text-red-700 hover:bg-red-600 hover:bg-opacity-10 rounded transition">
              <i class="fa-solid fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="title-xl">Jobs</h2>
            <p class="text-muted">Manage your job postings</p>
          </div>
          <button id="create-job-btn" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Create Job
          </button>
        </div>

        <section class="card">
          <div class="card-header">
            <h4 class="font-semibold">Your Jobs</h4>
            <span id="jobs-count" class="text-muted text-sm"></span>
          </div>
          <div id="jobs-container" class="space-y-4"></div>
        </section>
      </main>

      <!-- Create Job Modal -->
      <div id="create-job-modal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #1e1e30; padding: 2rem; border-radius: 0.75rem; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid #2a2a3e;">
          <h3 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; color: #ffffff;">Create New Job</h3>
          
          <form id="create-job-form">
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.25rem;">Job Title *</label>
              <input type="text" id="job-title" required style="width: 100%; padding: 0.5rem; background: #282838; border: 1px solid #3a3a4e; border-radius: 0.375rem; color: #ffffff; font-family: inherit;" placeholder="e.g., Senior Developer"/>
            </div>
            
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.25rem;">Description</label>
              <textarea id="job-description" style="width: 100%; padding: 0.5rem; background: #282838; border: 1px solid #3a3a4e; border-radius: 0.375rem; color: #ffffff; height: 100px; font-family: inherit;" placeholder="Job description..."></textarea>
            </div>
            
            <div style="margin-bottom: 1rem;">
              <label style="display: block; font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.25rem;">Location</label>
              <input type="text" id="job-location" style="width: 100%; padding: 0.5rem; background: #282838; border: 1px solid #3a3a4e; border-radius: 0.375rem; color: #ffffff; font-family: inherit;" placeholder="e.g., Remote"/>
            </div>
            
            <div style="margin-bottom: 1.5rem;">
              <label style="display: block; font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.25rem;">Requirements</label>
              <input type="text" id="job-requirements" style="width: 100%; padding: 0.5rem; background: #282838; border: 1px solid #3a3a4e; border-radius: 0.375rem; color: #ffffff; font-family: inherit;" placeholder="e.g., 5+ years, React, Node.js (comma separated)"/>
            </div>
            
            <div style="display: flex; gap: 0.75rem;">
              <button type="submit" style="flex: 1; padding: 0.75rem; background: #6366f1; color: white; border: none; border-radius: 0.375rem; font-weight: 500; cursor: pointer; font-family: inherit;">Create Job</button>
              <button type="button" id="close-modal-btn" style="flex: 1; padding: 0.75rem; background: #3a3a4e; color: #e5e7eb; border: none; border-radius: 0.375rem; cursor: pointer; font-family: inherit;">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/src/components/sidebar/sidebar.js"></script>
    <script type="module" src="./jobs.js"></script>
  </body>
</html>
