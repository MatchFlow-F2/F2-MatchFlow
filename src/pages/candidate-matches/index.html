<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Matches - MatchFlow</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div>
          <h1 class="sidebar-logo">MatchFlow</h1>

          <nav class="sidebar-nav">
            <a href="/src/pages/dashboard/index.html">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="/src/pages/jobs/index.html">
              <i class="fa-solid fa-briefcase"></i> Jobs
            </a>

            <a href="/src/pages/candidates/index.html">
              <i class="fa-solid fa-user-group"></i> Candidates
            </a>

            <a href="/src/pages/matches/index.html" class="active">
              <i class="fa-solid fa-handshake"></i> Matches
            </a>

            <a href="/src/pages/interviews/index.html">
              <i class="fa-solid fa-calendar-check"></i> Interviews
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1">
              <div class="avatar"></div>
              <div>
                <p class="user-name" id="profile-name">Candidate</p>
                <p class="user-role" id="profile-role">Candidate</p>
              </div>
            </div>
            <button id="logout-btn" title="Logout" class="px-2 py-1 text-red-600 hover:text-red-700 hover:bg-red-600 hover:bg-opacity-10 rounded transition">
              <i class="fa-solid fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <div>
          <h2 class="title-xl">My Matches</h2>
          <p class="text-muted">
            View your matches and communicate with companies
          </p>
        </div>

        <!-- Filtros por estado -->
        <section class="filter-bar">
          <button onclick="filterByStatus('all')" class="filter-btn" id="filter-all">
            Todos
          </button>
          <button onclick="filterByStatus('pending')" class="filter-btn" id="filter-pending">
            Pendientes
          </button>
          <button onclick="filterByStatus('contacted')" class="filter-btn" id="filter-contacted">
            Contactados
          </button>
          <button onclick="filterByStatus('interview')" class="filter-btn" id="filter-interview">
            En Entrevista
          </button>
          <button onclick="filterByStatus('hired')" class="filter-btn" id="filter-hired">
            Contratados
          </button>
          <button onclick="filterByStatus('discarded')" class="filter-btn" id="filter-discarded">
            Descartados
          </button>
        </section>

        <!-- Lista de Matches -->
        <section class="card">
          <h4 class="font-semibold mb-4">Mis Matches</h4>
          <div id="matches-list" class="matches-list">
            <!-- Los matches se cargarán aquí dinámicamente -->
          </div>
        </section>
      </main>
    </div>

    <!-- Modal de detalles del Match con Mensajería -->
    <div id="match-detail-modal" class="modal hidden">
      <div class="modal-content">
        <!-- Header del modal -->
        <div class="modal-header">
          <h3 class="modal-title" id="match-detail-title">
            Detalles del Match
          </h3>
          <button onclick="hideMatchDetailModal()" class="modal-close">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>

        <!-- Contenido del modal -->
        <div class="modal-body">
          <!-- Información del candidato -->
          <div id="match-detail-candidate" class="section-bg">
            <!-- Se llena dinámicamente -->
          </div>

          <!-- Sección de contacto (solo visible si estado >= contacted) -->
          <div id="match-detail-contact" class="hidden section-bg">
            <!-- Se llena dinámicamente -->
          </div>

          <!-- Sistema de mensajería interno -->
          <div id="match-detail-messaging" class="hidden">
            <h4 class="font-semibold mb-3 flex items-center gap-2">
              <i class="fa-solid fa-comments"></i>
              Mensajes Internos
            </h4>

            <div class="messages-container" id="messages-container">
              <!-- Mensajes se cargan aquí -->
            </div>

            <div class="message-input-row">
              <input
                type="text"
                id="message-input"
                placeholder="Escribe un mensaje..."
                class="form-input"
              />
              <button onclick="sendMessage()" class="btn btn-primary">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Footer con acciones -->
        <div id="match-detail-actions" class="modal-footer">
          <!-- Botones de acción se llenan dinámicamente -->
        </div>
      </div>
    </div>

    <script>
      window.API_URL = "http://localhost:3000";
    </script>
    <script src="/src/utils/match-logic.js"></script>
    <script src="/src/components/sidebar/sidebar.js"></script>
    <script src="./matches-ui.js"></script>
  </body>
</html>
