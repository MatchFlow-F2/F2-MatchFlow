<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matches - MatchFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #0f172a;
        color: #f1f5f9;
        font-family: 'Inter', sans-serif;
      }
      .sidebar {
        background-color: #1e293b;
        min-height: 100vh;
        width: 280px;
      }
      .sidebar a {
        color: #cbd5e1;
        transition: all 0.3s;
      }
      .sidebar a:hover {
        background-color: #334155;
        color: #f1f5f9;
      }
      .sidebar a.active {
        background-color: #475569;
        color: #fff;
      }
      .card-dark {
        background-color: #1e293b;
        border: 1px solid #334155;
        color: #f1f5f9;
      }
      .btn-primary-custom {
        background-color: #3b82f6;
        border: none;
        transition: all 0.3s;
      }
      .btn-primary-custom:hover {
        background-color: #2563eb;
        color: #fff;
      }
      .btn-outline-custom {
        border: 1px solid #475569;
        color: #cbd5e1;
      }
      .btn-outline-custom:hover {
        background-color: #334155;
        color: #f1f5f9;
      }
      .input-dark {
        background-color: #0f172a;
        border: 1px solid #334155;
        color: #f1f5f9;
      }
      .input-dark:focus {
        background-color: #0f172a;
        border-color: #3b82f6;
        color: #f1f5f9;
      }
      .match-card {
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        transition: all 0.3s;
      }
      .match-card:hover {
        background-color: #1e293b;
        cursor: pointer;
      }
      .text-muted-custom {
        color: #94a3b8;
      }
      .badge-pending { background-color: #6b7280; }
      .badge-contacted { background-color: #3b82f6; }
      .badge-interview { background-color: #f59e0b; }
      .badge-hired { background-color: #10b981; }
      .badge-discarded { background-color: #ef4444; }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <aside class="sidebar d-flex flex-column justify-content-between">
        <div>
          <h1 class="h4 fw-semibold mb-5">MatchFlow</h1>

          <nav class="d-flex flex-column gap-2">
            <a href="./dashboard.html" class="d-flex align-items-center gap-3 px-3 py-2 rounded text-decoration-none">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="./jobs.html" class="d-flex align-items-center gap-3 px-3 py-2 rounded text-decoration-none">
              <i class="fa-solid fa-briefcase"></i> Jobs
            </a>
            <a href="./candidates.html" class="d-flex align-items-center gap-3 px-3 py-2 rounded text-decoration-none">
              <i class="fa-solid fa-user-group"></i> Candidates
            </a>
            <a href="./matches.html" class="d-flex align-items-center gap-3 px-3 py-2 rounded active text-decoration-none">
              <i class="fa-solid fa-handshake"></i> Matches
            </a>
            <a href="./interviews.html" class="d-flex align-items-center gap-3 px-3 py-2 rounded text-decoration-none">
              <i class="fa-solid fa-calendar-check"></i> Interviews
            </a>
          </nav>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div class="bg-secondary-subtle rounded-circle" style="width: 40px; height: 40px;"></div>
          <div>
            <p class="small fw-medium mb-0">Company Name</p>
            <p class="small text-muted-custom mb-0">Recruiter</p>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-grow-1 p-4 p-md-5">
        <!-- Header -->
        <div class="mb-5">
          <h2 class="display-6 fw-bold">Matches</h2>
          <p class="text-muted-custom mt-2">Gestiona tus candidatos seleccionados</p>
        </div>

        <!-- Crear Match -->
        <div class="card card-dark mb-4">
          <div class="card-body">
            <h5 class="card-title mb-4">
              <i class="fa-solid fa-plus-circle text-primary me-2"></i>
              Crear Nuevo Match
            </h5>
            
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label text-muted-custom small">Selecciona Oferta</label>
                <select id="job-select" class="form-select form-select-sm input-dark">
                  <option value="">-- Selecciona una oferta --</option>
                </select>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label text-muted-custom small">Selecciona Candidato</label>
                <select id="candidate-select" class="form-select form-select-sm input-dark">
                  <option value="">-- Selecciona un candidato --</option>
                </select>
              </div>
              <div class="col-12 col-md-4 d-flex align-items-end">
                <button onclick="crearMatch()" class="btn btn-primary-custom w-100">
                  <i class="fa-solid fa-handshake me-2"></i> Crear Match
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
          <button onclick="filtrar('all')" id="filter-all" class="btn btn-outline-custom btn-sm active">
            Todos
          </button>
          <button onclick="filtrar('pending')" id="filter-pending" class="btn btn-outline-custom btn-sm">
            Pendientes
          </button>
          <button onclick="filtrar('contacted')" id="filter-contacted" class="btn btn-outline-custom btn-sm">
            Contactados
          </button>
          <button onclick="filtrar('interview')" id="filter-interview" class="btn btn-outline-custom btn-sm">
            En Entrevista
          </button>
          <button onclick="filtrar('hired')" id="filter-hired" class="btn btn-outline-custom btn-sm">
            Contratados
          </button>
          <button onclick="filtrar('discarded')" id="filter-discarded" class="btn btn-outline-custom btn-sm">
            Descartados
          </button>
          <div class="ms-auto">
            <button onclick="ejecutarPruebas()" class="btn btn-warning btn-sm" title="Ejecuta pruebas de estados en la consola">
              <i class="fa-solid fa-flask me-2"></i> Ejecutar Pruebas
            </button>
          </div>
        </div>

        <!-- Lista de Matches -->
        <div class="card card-dark">
          <div class="card-body">
            <h5 class="card-title mb-4">Mis Matches</h5>
            <div id="matches-list" class="d-flex flex-column gap-3">
              <!-- Los matches se cargarán aquí dinámicamente -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal de detalles del Match -->
    <div id="match-detail-modal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header border-secondary">
            <h5 class="modal-title" id="match-detail-title">Detalles del Match</h5>
            <button type="button" class="btn-close btn-close-white" onclick="cerrarDetalles()"></button>
          </div>

          <div class="modal-body">
            <!-- Información del candidato -->
            <div id="match-detail-candidate" class="card card-dark mb-3">
              <div class="card-body">
                <!-- Se llena dinámicamente -->
              </div>
            </div>

            <!-- Sección de contacto -->
            <div id="match-detail-contact" class="card card-dark mb-3" style="display: none;">
              <div class="card-body">
                <!-- Se llena dinámicamente -->
              </div>
            </div>

            <!-- Mensajería -->
            <div id="match-detail-messaging" style="display: none;">
              <h6 class="mb-3">
                <i class="fa-solid fa-comments me-2"></i> Mensajes Internos
              </h6>
              <div id="messages-container" class="card card-dark mb-3" style="max-height: 300px; overflow-y: auto;">
                <!-- Mensajes se cargan aquí -->
              </div>
              <div class="d-flex gap-2">
                <input type="text" id="message-input" placeholder="Escribe un mensaje..." class="form-control input-dark" />
                <button onclick="enviarMensaje()" class="btn btn-primary-custom btn-sm">
                  <i class="fa-solid fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="modal-footer border-secondary">
            <div id="match-detail-actions" class="d-flex gap-2 w-100">
              <!-- Botones de acción se llenan dinámicamente -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.API_URL = "http://localhost:3000";
    </script>
    <script src="../../utils/match-logic.js"></script>
    <script src="../../utils/match-states.test.js"></script>
    <script src="./matches.js"></script>
  </body>
</html>
