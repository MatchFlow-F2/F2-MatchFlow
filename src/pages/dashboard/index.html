<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../../../dist/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-background-app text-text-primary font-sans">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Main Content -->
      <main class="flex-1 p-8 space-y-8">
        <!-- Header -->
        <div>
          <h2 class="text-3xl font-bold">MatchFlow</h2>
          <p class="text-text-muted mt-1">Hiring management overview</p>
        </div>

        <!-- Metrics -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="bg-background-card p-5 rounded-xl shadow-card">
            <div class="flex justify-between items-center">
              <i class="fa-solid fa-briefcase text-text-muted"></i>
              <span class="text-green-500 text-sm">+1 this week</span>
            </div>
            <h3 id="metric-jobs" class="text-2xl font-bold mt-3">2</h3>
            <p class="text-text-muted text-sm">Published Jobs</p>
          </div>

          <div class="bg-background-card p-5 rounded-xl shadow-card">
            <div class="flex justify-between items-center">
              <i class="fa-solid fa-user-group text-text-muted"></i>
              <span class="text-green-500 text-sm">+10 this week</span>
            </div>
            <h3 id="metric-applicants" class="text-2xl font-bold mt-3">0</h3>
            <p class="text-text-muted text-sm">Applicants</p>
          </div>

          <div class="bg-background-card p-5 rounded-xl shadow-card">
            <div class="flex justify-between items-center">
              <i class="fa-solid fa-user-group text-text-muted"></i>
              <span class="text-green-500 text-sm">-2 this week</span>
            </div>
            <h3 id="metric-interviews" class="text-2xl font-bold mt-3">15</h3>
            <p class="text-text-muted text-sm">Schedule Interviews</p>
          </div>

          <div class="flex items-center justify-end">
            <button
              class="bg-brand hover:bg-brand-hover px-5 py-3 rounded-lg text-white flex items-center gap-2"
            >
              <i class="fa-solid fa-plus"></i> Create Job
            </button>
          </div>
        </section>

        <!-- Charts + Jobs Grid -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Application Trend -->
          <div class="bg-background-card p-6 rounded-xl shadow-card">
            <div class="flex justify-between mb-4">
              <h4 class="font-semibold">Application Trend</h4>
              <span class="text-text-muted text-sm">Last 6 weeks</span>
            </div>
            <canvas id="applicationsChart" height="120"></canvas>
          </div>

          <!-- Jobs Trend -->
          <div class="bg-background-card p-6 rounded-xl shadow-card">
            <div class="flex justify-between mb-4">
              <h4 class="font-semibold">Jobs Published Trend</h4>
              <span class="text-text-muted text-sm">Last 6 weeks</span>
            </div>
            <canvas id="jobsChart" height="120"></canvas>
          </div>

          <!-- Job List -->
          <div
            class="bg-background-card p-6 rounded-xl shadow-card flex flex-col"
          >
            <div class="flex justify-between items-center mb-4">
              <h4 class="font-semibold">Published Jobs</h4>
              <button
                class="bg-brand hover:bg-brand-hover px-4 py-2 rounded-lg text-white text-sm flex items-center gap-2"
              >
                <i class="fa-solid fa-plus"></i> Create Job
              </button>
            </div>

            <div
              id="jobs-list"
              class="space-y-3 overflow-y-auto pr-2"
              style="max-height: 220px"
            >
              <!-- Jobs injected by JS -->
            </div>
          </div>

          <!-- Matches Donut -->
          <div class="bg-background-card p-6 rounded-xl shadow-card">
            <div class="flex justify-between mb-4">
              <h4 class="font-semibold">Matches by Status</h4>
            </div>
            <div class="h-48">
              <canvas id="matchesChart"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./dashboard.js"></script>

    <!-- PROTECT ROUTE -->
    <script>
      (function () {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
          window.location.replace('../login/index.html');
          return;
        }
        if (user.role !== 'company') {
          window.location.replace('../candidates/index.html');
        }
      })();
    </script>
  </body>
</html>
